name: Release

on:
  push:
    tags: ["v*"]
  # Allows the Publish Release workflow (or a maintainer) to dispatch a run
  # on an existing tag ref.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: server
      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          web_version="$(bun -e 'console.log(require("./web/package.json").version)')"
          server_version="$(bun -e 'console.log(require("./server/package.json").version)')"

          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="${{ inputs.tag || github.ref_name }}"
          test "$tag" = "v$package_version"
          test "$web_version" = "$package_version"
          test "$server_version" = "$package_version"
          escaped_version="${package_version//./\\.}"
          grep -Eq "^## ${escaped_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun run precommit

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
          - windows-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: server
      - name: Build release package
        run: bun run package:${{ matrix.platform }}
      - name: Verify release package
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          platform="${{ matrix.platform }}"
          package_dir="shprd-$platform"
          versioned_archive="shprd-v$version-$platform.tar.xz"
          latest_archive="shprd-$platform.tar.xz"

          for archive in "$versioned_archive" "$latest_archive"; do
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum -c "$archive.sha256")
            else
              (cd dist && shasum -a 256 -c "$archive.sha256")
            fi
          done

          manifest="dist/shprd-$platform.update.json"
          test -f "$manifest"
          if command -v sha256sum >/dev/null 2>&1; then
            archive_digest="$(sha256sum "dist/$latest_archive" | awk '{ print $1 }')"
          else
            archive_digest="$(shasum -a 256 "dist/$latest_archive" | awk '{ print $1 }')"
          fi
          expected_manifest="{\"schema\":1,\"name\":\"shprd\",\"version\":\"$version\",\"platform\":\"$platform\",\"archive\":\"$latest_archive\",\"sha256\":\"$archive_digest\"}"
          grep -Fx "$expected_manifest" "$manifest"

          extract_dir="$RUNNER_TEMP/shprd-release"
          mkdir -p "$extract_dir"
          tar -xJf "dist/$versioned_archive" -C "$extract_dir"
          grep -Fx "shprd $version $platform" "$extract_dir/$package_dir/VERSION"
          binary_name="shprd"
          case "$platform" in
            windows-*) binary_name="shprd.exe" ;;
          esac
          binary="$extract_dir/$package_dir/$binary_name"
          case "$platform" in
            linux-x64)
              test "$("$binary" --version)" = "shprd $version"
              ;;
            linux-arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
            darwin-x64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*x86_64'
              ;;
            darwin-arm64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*arm64'
              ;;
            windows-x64)
              file "$binary" | grep -Eq 'PE32\+ executable.*x86-64.*MS Windows'
              ;;
            windows-arm64)
              file "$binary" | grep -Eq 'PE32\+ executable.*Aarch64.*MS Windows'
              ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shprd-${{ matrix.platform }}
          path: |
            dist/*.tar.xz*
            dist/*.update.json
          if-no-files-found: error
          retention-days: 7

  android:
    name: Package Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: "1.98.1"
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"
          sdkmanager --licenses <<<"$(printf 'y\n%.0s' {1..100})"
      - name: Install frontend dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd web --frozen-lockfile
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shprd-release.jks"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:?}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          scripts/build-android.sh
          android_project="target/dx/shprd-shell/release/android/app"
          unsigned_apk="$android_project/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned_apk"
          apk="$RUNNER_TEMP/shprd-v$version-android.apk"
          rm -f "$apk"
          apksigner sign \
            --ks "$RUNNER_TEMP/shprd-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$apk" \
            "$unsigned_apk"
          mkdir -p dist
          cp "$apk" "dist/shprd-v$version-android.apk"
          sha256sum "dist/shprd-v$version-android.apk" > "dist/shprd-v$version-android.apk.sha256"
      - name: Verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          export PATH="${ANDROID_SDK_ROOT:?}/build-tools/35.0.0:$PATH"
          apk="dist/shprd-v$version-android.apk"
          sha256sum -c "$apk.sha256"
          SHPRD_ANDROID_APK="$apk" bun test scripts/android-package.test.ts
          unzip -t "$apk"
          apksigner verify --verbose --print-certs "$apk"
          aapt dump badging "$apk" | grep -F "package: name='dev.nebuless.shprd' versionCode=\"1\" versionName=\"$version\""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shprd-android
          path: dist/shprd-v*-android.apk*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.tag || github.ref_name }}"
          dist/*
          scripts/install-shprd.sh
          --verify-tag
          --latest
          --generate-notes
          --title "SHPRD ${{ inputs.tag || github.ref_name }}"
