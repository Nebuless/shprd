[workspace]
members = ["crates/shprd-host", "crates/shprd-shell", "crates/shprd-agent", "crates/shprd-workspace", "crates/shprd-connections", "crates/shprd-settings", "crates/shprd-history"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Nebuless/shprd"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
