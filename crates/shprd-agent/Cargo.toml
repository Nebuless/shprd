[package]
name = "shprd-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Authenticated attachment to existing Senpi and Atomic runtimes"

[dependencies]
base64 = "0.22"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "avif-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "fs", "time", "macros", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
