[package]
name = "shprd-connections"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native connection profiles, generation leases, and SSH lifecycle"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "io-util", "net"] }
tempfile = "3"
regex = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
