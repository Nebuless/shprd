[package]
name = "shprd-history"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Readonly native agent session history projection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "sync", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
