[package]
name = "shprd-shell"
version.workspace = true
edition = "2024"
publish = false
license = "MIT"
description = "Dioxus shell hosting the retained SHPRD React client"

[features]
default = ["web"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
web-sys = { version = "=0.3.99", features = ["Location"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
