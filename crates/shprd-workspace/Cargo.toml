[package]
name = "shprd-workspace"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust file and Git services for resolved SHPRD checkouts"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
